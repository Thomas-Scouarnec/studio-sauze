<div class="equipment-header">
  <span class="section-label" i18n="@@equipment.label">Équipements</span>
  <h2 id="equipment-heading" class="section-title" i18n="@@equipment.title">Ce qui vous attend</h2>
</div>

<div class="equipment-blocks">
  @for (block of flatInfo.equipmentBlocks(); track block.id) {
    <article class="equipment-block" [class]="block.id" [class.text-only]="!block.photo">
      @if (block.photo; as photo) {
        <button type="button" class="equipment-photo" (click)="gallery.openAt(photo.src)">
          <img
            [ngSrc]="photo.src"
            [ngSrcset]="photo.srcset"
            sizes="(max-width: 768px) 90vw, 280px"
            [alt]="photo.alt"
            fill
          />
          <!--
            Signals that the photo opens, and nothing more. A count here would
            describe the whole gallery while sitting on one block's photo,
            which reads as "this block has N photos".
          -->
          <span class="equipment-photo-badge" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            </svg>
          </span>
          <!--
            Names the action after the photo's own description, so the button
            announces both. An aria-label here would replace the description.
          -->
          <span class="visually-hidden" i18n="@@equipment.openGallery">
            — ouvrir la galerie ({{ gallery.count() }} photos)
          </span>
        </button>
      }
      <div class="equipment-block-text">
        <h3 class="equipment-block-title">{{ block.title }}</h3>
        <p class="equipment-block-body">{{ block.body }}</p>
      </div>
    </article>
  }
</div>

<div class="equipment-extras">
  <h3 id="equipment-extras-heading" class="section-label" i18n="@@equipment.extras">Et aussi</h3>
  <ul class="equipment-list" aria-labelledby="equipment-extras-heading">
    @for (item of flatInfo.equipmentItems(); track item.label) {
      <li class="equipment-item">
        <span class="equipment-item-icon" aria-hidden="true">{{ item.icon }}</span>
        {{ item.label }}
      </li>
    }
  </ul>
</div>
