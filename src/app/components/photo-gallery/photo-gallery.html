<dialog
  #dialog
  class="gallery"
  tabindex="-1"
  aria-label="Galerie photos du studio"
  (close)="gallery.close()"
  (click)="onSurfaceClick($event)"
  (keydown.arrowleft)="gallery.previous()"
  (keydown.arrowright)="gallery.next()"
  (keydown.escape)="gallery.close()"
>
  @if (gallery.isOpen()) {
    <div class="gallery-surface">
      <button type="button" class="gallery-control gallery-close" (click)="gallery.close()">
        <span aria-hidden="true">&#10005;</span>
        <span class="visually-hidden">Fermer la galerie</span>
      </button>

      <div
        class="gallery-stage"
        (pointerdown)="onPointerDown($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerCancel()"
      >
        @for (photo of stagePhotos(); track photo.src) {
          <img
            [ngSrc]="photo.src"
            [ngSrcset]="photo.srcset"
            sizes="(max-width: 880px) 90vw, 800px"
            [alt]="photo.alt"
            draggable="false"
            fill
          />
        }
      </div>

      <div class="gallery-bar">
        <button type="button" class="gallery-control" (click)="gallery.previous()">
          <span aria-hidden="true">&#8249;</span>
          <span class="visually-hidden">Photo précédente</span>
        </button>

        <p class="gallery-counter" aria-live="polite">
          Photo {{ gallery.position() }} sur {{ gallery.count() }}
        </p>

        <button type="button" class="gallery-control" (click)="gallery.next()">
          <span aria-hidden="true">&#8250;</span>
          <span class="visually-hidden">Photo suivante</span>
        </button>
      </div>
    </div>
  }
</dialog>
