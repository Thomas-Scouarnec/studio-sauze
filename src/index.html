<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
    FR-9: a visitor who chose English and opens a French URL goes to the same
    page under /en/. Inline, first in <head>, so it runs before the prerendered
    French page can paint. Only the path matters, so it does nothing in the
    English build (always under /en/). The key is LANGUAGE_STORAGE_KEY in
    src/app/language-redirect.ts. Storage may throw: French stays (BR-6).
  -->
    <script>
      try {
        const path = location.pathname;
        if (
          localStorage.getItem('refuge.lang') === 'en' &&
          path !== '/en' &&
          path.indexOf('/en/') !== 0
        ) {
          location.replace('/en' + path + location.search + location.hash);
        }
      } catch (e) {}
    </script>
    <title>Notre Refuge au Sauze</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Description, link-preview tags and hreflang: PageTagsStrategy, per page. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
