# Checks every push and pull request; on main, once every check has passed,
# publishes the site to GitHub Pages. The only way the site is deployed:
# Pages is set to publish from GitHub Actions, so nothing else can.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Redeploy by hand (Actions tab → CI → Run workflow), still through every check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and AXE tests
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # The tests ran against this exact build (npm run e2e builds, prerenders and
      # runs finish-static-build.mjs): it is what gets deployed, not a rebuild.
      - name: Keep the tested site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/studio-sauze/browser

  # Lighthouse scores of every page (Bolt 25), shown on the run's summary page.
  # Report-only while its floors are measured on GitHub's runners.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds, serves the site like GitHub Pages, audits each page 3 times.
      - name: Run Lighthouse
        run: npm run lighthouse

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

  deploy:
    # Only from main, and only when lint, unit tests and browser tests all passed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits rather than cancelling one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
